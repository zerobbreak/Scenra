<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenra compact scene done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<section aria-label="Your app, between scenes" style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; border-radius: 14px; background: #FFFFFF; overflow: hidden; outline: 3px solid #34D399; color: #1B1A1F">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #F1EFEA; border-bottom: 1px solid #E4E2DC">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="margin-left: 8px; font-size: 13px; color: #5E5B66">Lumina · recording area</span>
</div>
<div style="padding: 250px 60px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 14px; background: #F3F1EC">
<span style="font-size: 22px; font-weight: 800">Product sync</span>
<div style="height: 10px; width: 70%; border-radius: 5px; background: #D9D6CE"></div>
<div style="height: 10px; width: 55%; border-radius: 5px; background: #D9D6CE"></div>
<div style="height: 10px; width: 62%; border-radius: 5px; background: #D9D6CE"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<div style="height: 120px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 120px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 120px; border-radius: 14px; background: #F3F1EC"></div>
</div>
</div>
</section>

<section aria-label="Scene finished (only you see this)" style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 820px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 14px 16px; border-radius: 24px; background: #0E1013; box-shadow: 0 20px 56px rgba(0,0,0,0.5)">
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #34D399; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#06281C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 800">Scene 2 done · Create a new note</span>
<span style="font-size: 12px; color: #B5B3AD">0:58 take · 3 of 3 actions ran · 1 approved by you</span>
</div>
<button type="button" style="font: inherit; flex: none; height: 44px; padding: 0 14px; border-radius: 14px; border: none; background: #33363D; color: #F2EFE8; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Retake</button>
<button type="button" style="font: inherit; flex: none; position: relative; overflow: hidden; height: 44px; padding: 0 18px; border-radius: 14px; border: none; background: #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Keep &amp; go to scene 3 <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; opacity: 0.85">· 4s</span><span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 3px; width: 60%; background: #A5B4FC"></span></button>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #15171B">
<span style="flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8D8F96">UP NEXT</span>
<p style="margin: 0; flex: 1; font-family: 'Literata', Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1.4; color: #F2EFE8">“Let’s ask Lumina to summarise the meeting.”</p>
<ol aria-label="Scenes" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 6px">
<li aria-label="Scene 1, kept" style="width: 24px; height: 24px; border-radius: 50%; background: #34D399; color: #06281C; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</li>
<li aria-label="Scene 2, kept" style="width: 24px; height: 24px; border-radius: 50%; background: #34D399; color: #06281C; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</li>
<li aria-label="Scene 3, next" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #818CF8; color: #C7D2FE; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</li>
<li aria-label="Scene 4" style="width: 24px; height: 24px; border-radius: 50%; background: #23262C; color: #8D8F96; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">4</li>
<li aria-label="Scene 5" style="width: 24px; height: 24px; border-radius: 50%; background: #23262C; color: #8D8F96; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">5</li>
</ol>
</div>
</section>

<div aria-hidden="true" style="position: absolute; top: 196px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(14,16,19,0.85); font-size: 12px; color: #C9C7C1">Recording holds between scenes · press Retake to redo just this one</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
