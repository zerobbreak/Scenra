<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenra record compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<section aria-label="Your app, being recorded" style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; border-radius: 14px; background: #FFFFFF; overflow: hidden; outline: 3px solid #F04438">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #F1EFEA; border-bottom: 1px solid #E4E2DC">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="margin-left: 8px; font-size: 13px; color: #5E5B66">Lumina · recording area</span>
</div>
<div style="padding: 170px 60px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 170px; border-radius: 14px; background: #F3F1EC"></div>
</div>
</section>

<section aria-label="Script line (only you see this)" style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 780px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 12px 18px; border-radius: 22px; background: #0E1013; box-shadow: 0 16px 44px rgba(0,0,0,0.45)">
<div style="display: flex; align-items: center; gap: 14px">
<span style="display: flex; align-items: center; gap: 6px; flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FCA5A5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F04438"></span>00:42</span>
<p style="margin: 0; flex: 1; font-family: 'Literata', Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.35; color: #FFFFFF">Now let’s create a new note.</p>
<span style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 5px; border-radius: 999px; background: #4F46E5; font-size: 12px; font-weight: 700; color: #FFFFFF"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="8" height="10" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2l13 9-6 1.5L6.5 19z" fill="#4F46E5"></path></svg></span>Click New Recording</span>
<button type="button" aria-label="Next" style="width: 38px; height: 38px; flex: none; border-radius: 50%; border: none; background: #4F46E5; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div aria-hidden="true" style="display: flex; gap: 3px; height: 4px; margin-right: 52px">
<span style="flex: 3; border-radius: 2px; background: #34D399"></span><span style="flex: 7; border-radius: 2px; background: #23262C"></span><span style="flex: 4; border-radius: 2px; background: #23262C"></span>
</div>
</section>

<nav aria-label="Controls (minimised)" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 18px; background: rgba(14,16,19,0.85); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1)">
<button type="button" aria-label="Pause" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Show full prompter" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Stop recording" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #DC2626; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="#FFFFFF"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
