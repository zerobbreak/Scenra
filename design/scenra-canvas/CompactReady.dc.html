<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<section aria-label="Your app, about to be recorded" style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; border-radius: 14px; background: #FFFFFF; overflow: hidden; outline: 3px dashed #4C4F57; color: #1B1A1F">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #F1EFEA; border-bottom: 1px solid #E4E2DC">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="margin-left: 8px; font-size: 13px; color: #5E5B66">Lumina · recording area</span>
</div>
<div style="padding: 230px 60px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div>
</div>
</section>

<section aria-label="Get ready (only you see this)" style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 780px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 14px 14px; border-radius: 22px; background: #0E1013; box-shadow: 0 16px 44px rgba(0,0,0,0.45)">
<div style="display: flex; align-items: center; gap: 16px">
<div role="timer" aria-label="Recording starts in 3 seconds" style="position: relative; width: 56px; height: 56px; flex: none; border-radius: 50%; background: #1A1C21; display: flex; align-items: center; justify-content: center">
<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="position: absolute; left: 0; top: 0"><circle cx="28" cy="28" r="25" fill="none" stroke="#23262C" stroke-width="4"></circle><circle cx="28" cy="28" r="25" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="52" transform="rotate(-90 28 28)"></circle></svg>
<span style="position: relative; font-size: 24px; font-weight: 800">3</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8D8F96">STARTS IN 3 · SCENE 1 OF 5 · WELCOME</span>
<p style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.35; color: #FFFFFF">Welcome to Lumina, an AI-powered note-taking application.</p>
</div>
<button type="button" style="font: inherit; flex: none; height: 44px; padding: 0 18px; border-radius: 14px; border: none; background: #4F46E5; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Start now</button>
<button type="button" style="font: inherit; flex: none; height: 44px; padding: 0 14px; border-radius: 14px; border: none; background: #33363D; color: #F2EFE8; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
</div>
<ul aria-label="Ready checks" style="margin: 0; padding: 0 0 0 72px; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
<li style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #10261E; color: #A7F3D0; font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>OBS connected</li>
<li style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #10261E; color: #A7F3D0; font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Mic level good</li>
<li style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #10261E; color: #A7F3D0; font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Lumina window found</li>
<li style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #1A1C21; color: #C9C7C1; font-size: 12px; font-weight: 600">5 scenes · 12 actions</li>
</ul>
</section>

<div aria-hidden="true" style="position: absolute; top: 186px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(14,16,19,0.85); font-size: 12px; color: #C9C7C1">The dashed area is what gets recorded · this pill never appears in the video</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
