<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option B: Cue Cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
</style>
</helmet>
<div style="position: relative; width: 1040px; height: 660px; overflow: hidden; background: #F6F5F1; color: #1B1A1F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<header style="position: absolute; left: 22px; right: 22px; top: 18px; display: flex; align-items: center; gap: 12px">
<span style="font-weight: 800; font-size: 18px; letter-spacing: -0.02em">Scenra</span>
<span aria-hidden="true" style="display: flex; gap: 5px; margin-left: 10px">
<span style="width: 18px; height: 6px; border-radius: 3px; background: #1B1A1F"></span>
<span style="width: 30px; height: 6px; border-radius: 3px; background: #4338CA"></span>
<span style="width: 18px; height: 6px; border-radius: 3px; background: #DAD7CF"></span>
<span style="width: 18px; height: 6px; border-radius: 3px; background: #DAD7CF"></span>
<span style="width: 18px; height: 6px; border-radius: 3px; background: #DAD7CF"></span>
</span>
<span style="font-size: 13px; color: #5E5B66">Card 2 of 5</span>
</header>

<aside aria-label="Live preview" style="position: absolute; left: 22px; top: 76px; width: 200px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E2DC">
<span style="font-size: 12px; font-weight: 700; color: #5E5B66">Your app right now</span>
<div style="height: 118px; border-radius: 12px; background: #F3F1EC; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="height: 8px; width: 60px; border-radius: 4px; background: #DAD7CF"></span><span style="height: 14px; width: 46px; border-radius: 5px; background: #1B1A1F; outline: 2px solid #4338CA; outline-offset: 2px"></span></div>
<div style="flex: 1; border-radius: 8px; background: #FFFFFF"></div>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #157F3C; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1E9E4A"></span>Everything ready</span>
</aside>

<div aria-hidden="true" style="position: absolute; left: 50%; top: 96px; width: 500px; height: 360px; transform: translateX(-50%) rotate(3.5deg); border-radius: 24px; background: #ECEAE4"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 88px; width: 500px; height: 360px; transform: translateX(-50%) rotate(-2deg); border-radius: 24px; background: #F1EFEA; border: 1px solid #E4E2DC"></div>

<article aria-label="Cue card 2" style="position: absolute; left: 50%; top: 78px; width: 520px; height: 380px; transform: translateX(-50%); box-sizing: border-box; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E4E2DC; box-shadow: 0 22px 46px rgba(27,26,31,0.10); display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5E5B66">SCENE 02 · CREATE A NEW NOTE</span>
<p style="margin: 0; font-size: 27px; line-height: 1.38; font-weight: 700; letter-spacing: -0.01em">“Now let’s create a new note. Lumina lets you record meetings and automatically generate structured notes.”</p>
<div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: #EEF0FF; border: 1px solid #D5D8FB">
<span style="width: 38px; height: 38px; flex: none; border-radius: 11px; background: #4338CA; display: flex; align-items: center; justify-content: center">
<svg width="16" height="18" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2l13 9-6 1.5L6.5 19z" fill="#FFFFFF"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #312E81; font-weight: 600">When you press Next, Scenra will</span>
<strong style="font-size: 15px">Click “New Recording”</strong>
</div>
</div>
</article>

<nav aria-label="Recording dock" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 24px; background: rgba(27,26,31,0.86); backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 14px 40px rgba(27,26,31,0.28)">
<div role="status" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,0.08); color: #FFFFFF">
<span style="width: 9px; height: 9px; border-radius: 50%; background: #F04438; box-shadow: 0 0 0 4px rgba(240,68,56,0.25)"></span>
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em">REC</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">00:42</span>
</div>
<button type="button" aria-label="Previous card" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #55525C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" style="font: inherit; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 34px; border-radius: 17px; border: none; background: #4338CA; color: #FFFFFF; font-size: 19px; font-weight: 800; cursor: pointer">Next
<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" aria-label="Pause" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #55525C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Stop recording" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #D92D20; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
