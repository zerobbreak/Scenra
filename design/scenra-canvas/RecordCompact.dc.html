<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenra compact recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B2A30}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #2B2A30; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B1A1F">

<section aria-label="Your app, being recorded" style="position: absolute; left: 24px; top: 20px; right: 24px; bottom: 24px; background: #FFFFFF; border-radius: 12px; overflow: hidden; outline: 3px solid #D92D20">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #F1EFEA; border-bottom: 1px solid #E4E2DC">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="margin-left: 8px; font-size: 13px; color: #5E5B66">Lumina · recording area</span>
</div>
<div style="padding: 150px 60px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 180px; border-radius: 14px; background: #F3F1EC"></div>
</div>
</section>

<section aria-label="Script line (only you see this)" style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%); width: 720px; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 999px; background: #121116; color: #FFFFFF; box-shadow: 0 14px 40px rgba(0,0,0,0.4)">
<span style="display: flex; align-items: center; gap: 6px; flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FFB4AE">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #F04438"></span>00:42</span>
<p style="margin: 0; flex: 1; font-size: 17px; font-weight: 600; line-height: 1.35">You can pause at any point, and Lumina keeps everything safe.</p>
<span style="flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(154,160,255,0.18); color: #DCDDFF; font-size: 12px; font-weight: 600">Next: click Stop</span>
<span style="flex: none; display: flex; gap: 4px">
<button type="button" aria-label="Previous line" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: #2C2A31; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button type="button" aria-label="Next line" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: #4338CA; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</span>
</section>

<div aria-hidden="true" style="position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #5E5B66">Compact mode · the line sits under your webcam · never in the video</div>

<nav aria-label="Recording dock (minimised)" style="position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 20px; background: rgba(27,26,31,0.72); backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 12px 36px rgba(0,0,0,0.3)">
<button type="button" aria-label="Do next action (Ctrl Alt Space)" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #4338CA; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM18 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button type="button" aria-label="Pause (Ctrl Alt P)" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #55525C; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
</button>
<button type="button" aria-label="Show full script" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #55525C; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
</button>
<button type="button" aria-label="Stop recording" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #D92D20; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"></path></svg>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
