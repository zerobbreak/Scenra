<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenra cue cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<header style="position: absolute; left: 28px; right: 28px; top: 22px; display: flex; align-items: center; gap: 14px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #FCA5A5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F04438; box-shadow: 0 0 0 4px rgba(240,68,56,0.22)"></span>REC <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500">00:42</span></span>
<span aria-hidden="true" style="display: flex; gap: 5px; margin-left: 8px">
<span style="width: 20px; height: 6px; border-radius: 3px; background: #34D399"></span>
<span style="width: 34px; height: 6px; border-radius: 3px; background: #818CF8"></span>
<span style="width: 20px; height: 6px; border-radius: 3px; background: #2A2D33"></span>
<span style="width: 20px; height: 6px; border-radius: 3px; background: #2A2D33"></span>
<span style="width: 20px; height: 6px; border-radius: 3px; background: #2A2D33"></span>
</span>
<span style="font-size: 13px; color: #8D8F96">Card 2 of 5 · Create a new note</span>
<span style="margin-left: auto; font-size: 13px; color: #8D8F96">Only you see this screen</span>
</header>

<figure aria-label="Live preview of your app" style="position: absolute; left: 28px; top: 78px; width: 230px; margin: 0; padding: 8px; border-radius: 16px; background: #1A1C21; border: 1px solid #2A2D33">
<div style="height: 130px; border-radius: 10px; background: #F3F1EC; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="height: 7px; width: 60px; border-radius: 4px; background: #D9D6CE"></span><span style="height: 14px; width: 48px; border-radius: 4px; background: #1B1A1F; outline: 2px solid #6366F1; outline-offset: 2px"></span></div>
<div style="flex: 1; border-radius: 6px; background: #FFFFFF"></div>
</div>
<figcaption style="display: flex; align-items: center; gap: 6px; padding: 8px 4px 2px; font-size: 11px; color: #8D8F96"><span style="width: 6px; height: 6px; border-radius: 50%; background: #34D399"></span>Your app · ready</figcaption>
</figure>

<div aria-hidden="true" style="position: absolute; left: 50%; top: 104px; width: 600px; height: 430px; transform: translateX(-50%) rotate(3.5deg); border-radius: 28px; background: #15171B"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 96px; width: 600px; height: 430px; transform: translateX(-50%) rotate(-2deg); border-radius: 28px; background: #1A1C21; border: 1px solid #22252B"></div>

<article aria-label="Cue card 2" style="position: absolute; left: 50%; top: 86px; width: 620px; height: 450px; transform: translateX(-50%); box-sizing: border-box; padding: 34px 38px; border-radius: 28px; background: #1E2026; border: 1px solid #2E3138; box-shadow: 0 30px 70px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 18px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8D8F96">SCENE 02 · CREATE A NEW NOTE</span>
<p style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 34px; line-height: 1.38; font-weight: 600; color: #FFFFFF">“Now let’s create a new note. Lumina lets you record meetings and automatically generate structured notes.”</p>
<div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: #1E1D3A; border: 1px solid #3B3A6B">
<span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #4F46E5; display: flex; align-items: center; justify-content: center"><svg width="16" height="18" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2l13 9-6 1.5L6.5 19z" fill="#FFFFFF"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #C7CBF7; font-weight: 600">When you press Next, Scenra will</span>
<strong style="font-size: 16px">Click “New Recording”</strong>
</div>
</div>
</article>

<nav aria-label="Controls" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 22px; background: rgba(32,34,40,0.88); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1)">
<button type="button" aria-label="Previous card" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" style="font: inherit; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 40px; border-radius: 17px; border: none; background: #4F46E5; color: #FFFFFF; font-size: 19px; font-weight: 800; cursor: pointer">Next
<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" aria-label="Pause" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Stop recording" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #DC2626; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="#FFFFFF"></path></svg></button>
</nav>
<span style="position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; color: #6F727A">or press <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px">Ctrl Alt Space</kbd></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
