<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenra record focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<header style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 28px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px; font-size: 13px; color: #8D8F96">
<span style="display: flex; align-items: center; gap: 8px; color: #FCA5A5; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F04438; box-shadow: 0 0 0 4px rgba(240,68,56,0.22)"></span>REC <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500">00:42</span></span>
<span>Scene 2 of 5 · Create a new note</span>
<span style="margin-left: auto">Only you see this screen</span>
</div>
<div role="img" aria-label="Scene track: sentence 1 of 3, next action at the end of this sentence" style="display: flex; gap: 4px; height: 8px">
<div style="flex: 3; position: relative; border-radius: 4px; background: #34D399">
<span style="position: absolute; right: -2px; top: -5px; width: 18px; height: 18px; border-radius: 50%; background: #4F46E5; border: 2px solid #0E1013"></span>
<span style="position: absolute; left: 62%; top: -4px; width: 3px; height: 16px; border-radius: 2px; background: #FFFFFF"></span>
</div>
<div style="flex: 7; position: relative; border-radius: 4px; background: #23262C">
<span style="position: absolute; left: 44%; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: #2E2B5E; border: 2px solid #0E1013"></span>
</div>
<div style="flex: 4; border-radius: 4px; background: #23262C"></div>
</div>
</header>

<main style="position: absolute; left: 140px; right: 300px; top: 120px; display: flex; flex-direction: column; gap: 28px; font-family: 'Literata', Georgia, serif">
<p style="margin: 0; font-size: 22px; line-height: 1.5; color: #4C4F57">Welcome to Lumina, an AI-powered note-taking application.</p>
<p style="margin: 0; font-size: 42px; line-height: 1.35; font-weight: 600; color: #FFFFFF; letter-spacing: -0.01em">Now let’s create a new note.
<span style="display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; margin-left: 6px; padding: 6px 14px 6px 8px; border-radius: 999px; background: #4F46E5; box-shadow: 0 0 0 6px rgba(79,70,229,0.25); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; color: #FFFFFF">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="13" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2l13 9-6 1.5L6.5 19z" fill="#4F46E5"></path></svg></span>Next · Click New Recording</span></p>
<p style="margin: 0; font-size: 28px; line-height: 1.5; color: #A6A49E">Lumina allows you to record meetings
<span style="display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; padding: 3px 10px 3px 6px; border-radius: 999px; border: 1.5px solid #3B3A6B; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; color: #A5B4FC">
<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12h10M3 8h7M3 4h10" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round"></path></svg>Type “Product sync”</span>
and automatically generate structured notes.</p>
</main>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(rgba(14,16,19,0), #0E1013 72%)"></div>

<figure aria-label="Live preview of your app" style="position: absolute; right: 24px; top: 120px; width: 250px; margin: 0; padding: 8px; border-radius: 16px; background: #1A1C21; border: 1px solid #2A2D33">
<div style="height: 140px; border-radius: 10px; background: #F3F1EC; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="height: 7px; width: 60px; border-radius: 4px; background: #D9D6CE"></span><span style="height: 14px; width: 50px; border-radius: 4px; background: #1B1A1F; outline: 2px solid #6366F1; outline-offset: 2px"></span></div>
<div style="flex: 1; border-radius: 6px; background: #E7E4DD"></div>
</div>
<figcaption style="display: flex; align-items: center; gap: 6px; padding: 8px 4px 2px; font-size: 11px; color: #8D8F96"><span style="width: 6px; height: 6px; border-radius: 50%; background: #F04438"></span>Live · target found</figcaption>
</figure>

<nav aria-label="Controls" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 22px; background: rgba(32,34,40,0.85); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1)">
<button type="button" style="font: inherit; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 15px; border: none; background: #4F46E5; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Next <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,0.18)">Ctrl Alt Space</kbd></button>
<button type="button" aria-label="Pause" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
</button>
<button type="button" aria-label="Retry scene" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button type="button" aria-label="Stop recording" style="width: 52px; height: 52px; border-radius: 15px; border: none; background: #DC2626; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="#FFFFFF"></path></svg>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
