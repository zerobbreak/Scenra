<x-dc>

<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0E1013; color: #F2EFE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

<section aria-label="Your app, being recorded" style="position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; border-radius: 14px; background: #FFFFFF; overflow: hidden; outline: 3px solid #F04438; color: #1B1A1F">

<span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #D5D2CB"></span>
<span style="margin-left: 8px; font-size: 13px; color: #5E5B66">Lumina · recording area</span>
</div>
<div style="padding: 190px 60px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="height: 20px; width: 220px; border-radius: 6px; background: #D9D6CE"></div>
<span style="position: relative; padding: 12px 20px; border-radius: 10px; background: #1B1A1F; color: #FFFFFF; font-size: 15px; font-weight: 700; outline: 2px solid #6366F1; outline-offset: 4px">New Recording</span>
</div>

<div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div>
<div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div><div style="height: 150px; border-radius: 14px; background: #F3F1EC"></div>
</div>
</div>
</section>

<div aria-hidden="true" style="position: absolute; right: 70px; top: 172px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: #4F46E5; color: #FFFFFF; font-size: 12px; font-weight: 700">Scenra clicks here on “note”</div>

<section aria-label="Script line (only you see this)" style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 820px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px 18px; border-radius: 22px; background: #0E1013; box-shadow: 0 16px 44px rgba(0,0,0,0.45)">
<div style="display: flex; align-items: center; gap: 14px">
<span style="display: flex; align-items: center; gap: 6px; flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FCA5A5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F04438"></span>00:42</span>
<p style="margin: 0; flex: 1; font-family: 'Literata', Georgia, serif; font-size: 20px; font-weight: 600; line-height: 1.35; color: #FFFFFF"><span style="color: #8D8F96">Now let’s create</span> a new <span style="padding-bottom: 2px; border-bottom: 3px solid #818CF8">note</span>.</p>
<span style="flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: #4F46E5; box-shadow: 0 0 0 5px rgba(79,70,229,0.25); font-size: 12px; font-weight: 700; color: #FFFFFF"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="9" height="11" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2l13 9-6 1.5L6.5 19z" fill="#4F46E5"></path></svg></span>Click New Recording<span style="padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,0.2); font-weight: 600">in 2 words</span></span>
<button type="button" aria-label="Do it now (Ctrl Alt Space)" style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM18 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div role="img" aria-label="Scene 2 of 5, sentence 1 of 3" style="display: flex; align-items: center; gap: 10px; margin-right: 54px">
<span style="flex: none; font-size: 11px; font-weight: 700; color: #8D8F96">SCENE 2/5</span>
<div style="flex: 1; display: flex; gap: 3px; height: 4px">
<span style="flex: 3; position: relative; border-radius: 2px; background: #34D399"><span style="position: absolute; right: -4px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: #818CF8; border: 2px solid #0E1013"></span></span>
<span style="flex: 7; position: relative; border-radius: 2px; background: #23262C"><span style="position: absolute; left: 44%; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: #3B3A6B; border: 2px solid #0E1013"></span></span>
<span style="flex: 4; border-radius: 2px; background: #23262C"></span>
</div>
<span style="flex: none; font-size: 11px; color: #8D8F96">Next: type “Product sync”</span>
</div>
</section>

<nav aria-label="Controls (minimised)" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 18px; background: rgba(14,16,19,0.85); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1)">
<button type="button" aria-label="Pause" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Retry scene" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" aria-label="Show full prompter" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #33363D; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
<button type="button" aria-label="Stop recording" style="width: 44px; height: 44px; border-radius: 13px; border: none; background: #DC2626; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" fill="#FFFFFF"></path></svg></button>
</nav>
</div>
</x-dc>
